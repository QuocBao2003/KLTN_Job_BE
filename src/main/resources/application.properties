spring.application.name=demo
server.port=9095
#config database
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DATABASE}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.address=127.0.0.1
spring.jackson.serialization.fail-on-empty-beans=false
#config jwt
demo.jwt.base64-secret=${JWT_SECRET}
#expiration 1 day (seconds)
demo.jwt.access-token-validity-in-seconds=8640000
demo.jwt.refresh-token-validity-in-seconds=8640000
##config pagination
##start page =1
spring.data.web.pageable.one-indexed-parameters=true

#config upload file
cloudinary.cloud-name:${CLOUDINARY_NAME}
cloudinary.api-key:${CLOUDINARY_API_KEY}
cloudinary.api-secret:${CLOUDINARY_API_SECRET}
# default = 1MB
spring.servlet.multipart.max-file-size=50MB
#default = 10MB
spring.servlet.multipart.max-request-size=50MB

#spring_openAi
spring.ai.openai.api-key=${API_KEY_OPENAI}
spring.ai.openai.chat.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions
spring.ai.openai.chat.options.model=gemini-2.0-flash
#base path
demo.upload-file.base-uri=file:///D:/HocTaiNha/SpringRestfulAPI/upload/

#config email with Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


#google
outbound.indentity.client-id=${GG_CLIENT_ID}
outbound.indentity.client-secret=${GG_CLIENT_SECRET}
outbound.indentity.redirect-uri=http://localhost:3000/authenticate
outbound.indentity.grant-type=authorization_code



spring.jpa.defer-datasource-initialization=true
spring.ai.chat.memory.enabled=true


logging.level.org.springframework.ai=DEBUG
logging.level.org.apache.pdfbox=WARN
logging.level.org.apache.tika=WARN
